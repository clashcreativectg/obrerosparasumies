<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Multimedia | ICEA - Obreros para Su Mies</title>
  <meta name="description" content="Predicaciones, alabanzas y mensajes multimedia de ICEA - Obreros para Su Mies." />
  <meta name="theme-color" content="#f04a00" />
  <link rel="shortcut icon" href="img/ICEA.png" type="image/x-icon" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

  <style>
    :root {
      --primary:#f04a00;
      --primary-dark:#b93500;
      --gold:#ffd36a;
      --blue:#2f4fa8;
      --dark:#07111f;
      --dark-2:#0d2242;
      --panel:#122b4f;
      --text:#ffffff;
      --text-muted:rgba(255,255,255,0.7);
    }

    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background-color: var(--dark);
      color: var(--text);
      font-family: 'Open Sans', sans-serif;
      overflow-x: hidden;
    }

    /* Header & Navigation */
    .header {
      background: rgba(7, 17, 31, 0.85);
      backdrop-filter: blur(12px);
      position: fixed; top:0; left:0; width:100%; z-index:100;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .nav {
      max-width:1200px; margin:0 auto; padding:1.2rem 2rem;
      display:flex; justify-content:space-between; align-items:center;
    }
    .brand { display:flex; align-items:center; gap:.8rem; text-decoration:none; }
    .brand__logo { width:42px; height:42px; object-fit:contain; }
    .brand__title {
      font-family:'Montserrat', sans-serif; font-weight:900;
      font-size:1.4rem; line-height:1.2; letter-spacing:.02em; color:#fff;
    }
    .menu { display:flex; gap:1.8rem; list-style:none; align-items:center; }
    .menu__link {
      text-decoration:none; color:var(--text-muted); font-weight:600; font-size:.95rem;
      transition:color .3s, transform .3s; display:flex; align-items:center; gap:8px;
    }
    .menu__link:hover, .menu__link--active { color:var(--primary); transform:translateY(-1px); }

    /* Hero Section */
    .hero {
      padding:10rem 2rem 5rem; text-align:center;
      background: radial-gradient(circle at 50% -20%, var(--dark-2) 0%, var(--dark) 70%);
      position:relative;
    }
    .section-title {
      font-family:'Montserrat', sans-serif; font-size:2.8rem; font-weight:800;
      margin-bottom:1rem; text-transform:uppercase; letter-spacing:-0.02em;
    }
    .section-title span { color:var(--primary); }
    .hero__subtitle { color:var(--text-muted); font-size:1.1rem; max-width:600px; margin:0 auto 2rem; }

    /* Layout Grids */
    .container { max-width:1200px; margin:0 auto; padding:0 2rem 7rem; }
    .grid {
      display:grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap:2.5rem; width:100%;
    }

    /* Media Cards */
    .media-card {
      background: var(--dark-2); border-radius:16px; overflow:hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
      border: 1px solid rgba(255,255,255,0.04);
      transition: transform .1s ease, box-shadow .3s ease;
      transform-style: preserve-3d;
    }
    .media-card:hover {
      box-shadow: 0 20px 40px rgba(240,74,0,0.15);
      border-color: rgba(240,74,0,0.25);
    }
    .media-card__wrapper {
      position:relative; width:100%;
      height: 0; padding-top: 56.25%; background:#000;
      overflow:hidden;
    }
    .media-card__video {
      position:absolute; top:0; left:0; width:100%; height:100%; object-fit:cover;
    }
    .media-card__body { padding:1.5rem; transform: translateZ(30px); }
    .media-card__meta { display:flex; justify-content:space-between; margin-bottom:.8rem; font-size:.8rem; }
    .media-card__date { color:var(--text-muted); }
    .media-card__tag { color:var(--gold); font-weight:700; text-transform:uppercase; letter-spacing:.05em; }
    .media-card__title { font-family:'Montserrat', sans-serif; font-size:1.15rem; font-weight:700; line-height:1.4; color:#fff; }

    /* Footer */
    .footer { text-align:center; padding:3rem; border-top:1px solid rgba(255,255,255,0.05); color:var(--text-muted); font-size:.9rem; }

    /* Animations */
    .reveal-item { opacity:0; transform:translateY(30px); transition:opacity .8s ease, transform .8s ease; }
    .reveal-item.is-visible { opacity:1; transform:translateY(0); }

    @media (max-width:768px) {
      .menu { display:none; }
      .section-title { font-size:2.2rem; }
      .grid { grid-template-columns: 1fr; gap:1.8rem; }
    }
  </style>
</head>
<body>

  <!-- ==================== HEADER ==================== -->
  <header class="header">
    <nav class="nav">
      <a class="brand" href="index.html">
        <img class="brand__logo" src="img/ICEA.png" alt="ICEA Logo" />
        <h1 class="brand__title">ICEA</h1>
      </a>
      <ul class="menu">
        <li><a class="menu__link" href="index.html"><i class="fas fa-home"></i> Inicio</a></li>
        <li><a class="menu__link" href="nosotros.html"><i class="fas fa-book-open"></i> Historia</a></li>
        <li><a class="menu__link" href="galeria.html"><i class="fas fa-images"></i> Galería</a></li>
        <li><a class="menu__link menu__link--active" href="multimedia.html"><i class="fas fa-film"></i> Multimedia</a></li>
        <li><a class="btn btn--primary" href="contacto.html"><i class="fas fa-envelope"></i> Contáctanos</a></li>
      </ul>
    </nav>
  </header>

  <!-- ==================== HERO SECTION ==================== -->
  <section class="hero">
    <div class="hero__content">
      <h2 class="section-title">Sección <span>Multimedia</span></h2>
      <p class="hero__subtitle">Disfruta de nuestras predicaciones, enseñanzas y recursos de video directo desde la nube.</p>
    </div>
  </section>

  <!-- ==================== CONTENIDO MULTIMEDIA ==================== -->
  <main class="container">
    <div class="grid firebase-grid">
      <div class="empty" style="grid-column: 1/-1; text-align: center; padding: 60px;">
        <div style="font-size: 3.5rem; color: var(--primary); margin-bottom: 12px;"><i class="fas fa-spinner fa-spin"></i></div>
        <h3 style="color: #fff; font-family:'Montserrat', sans-serif;">Conectando con el servidor...</h3>
      </div>
    </div>
  </main>

  <!-- ==================== FOOTER ==================== -->
  <footer class="footer">
    <p>&copy; 2026 ICEA - Obreros para Su Mies. Todos los derechos reservados.</p>
  </footer>

  <!-- ==================== SCRIPTS VISUALES ==================== -->
  <script>
    const revealItems = document.querySelectorAll(".reveal-item, .section-title, .hero__content");
    const revealObserver = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if(entry.isIntersecting){
          entry.target.classList.add("is-visible");
          revealObserver.unobserve(entry.target);
        }
      });
    }, { threshold:.14 });
    revealItems.forEach(item => revealObserver.observe(item));

    function applyTiltToCards(){
      const cards = document.querySelectorAll(".media-card");
      cards.forEach(card => {
        if (card.dataset.tiltReady) return;
        card.dataset.tiltReady = "true";

        card.addEventListener("mousemove", e => {
          const rect = card.getBoundingClientRect();
          const x = e.clientX - rect.left;
          const y = e.clientY - rect.top;
          const rotateY = ((x / rect.width) - .5) * 12;
          const rotateX = -((y / rect.height) - .5) * 12;
          card.style.transform = `perspective(950px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) translateY(-8px) translateZ(18px)`;
        });

        card.addEventListener("mouseleave", () => {
          card.style.transform = "perspective(950px) rotateX(0deg) rotateY(0deg) translateY(0) translateZ(0)";
        });
      });
    }

    applyTiltToCards();

    const gridObserver = new MutationObserver(applyTiltToCards);
    document.querySelectorAll(".firebase-grid").forEach(grid => {
      gridObserver.observe(grid, { childList:true, subtree:true });
    });
  </script>

  <!-- CONTROL DE CONEXIÓN CON FIREBASE -->
  <script type="module" src="js/render-multimedia.js"></script>
</body>
</html>
